<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Snake Game 🐍</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.7)),
        url("https://images.unsplash.com/photo-1531386151447-fd76ad50012f?auto=format&fit=crop&w=1600&q=80")
        center/cover fixed;

    font-family: Arial, sans-serif;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 95%;
    max-width: 700px;
    text-align: center;
}

h1 {
    font-size: 45px;
    margin-bottom: 15px;
    text-shadow: 0 3px 10px black;
}

.score-box {
    display: flex;
    justify-content: space-around;
    background: rgba(0,0,0,.75);
    border: 2px solid #39ff14;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    font-size: 22px;
    font-weight: bold;
}

canvas {
    width: 100%;
    max-width: 600px;
    aspect-ratio: 1;
    background:
        linear-gradient(
            rgba(20,70,20,.45),
            rgba(10,40,10,.55)
        ),
        #163b16;

    border: 7px solid #654321;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(0,255,0,.4);

    display: block;
    margin: auto;
}

#message {
    height: 35px;
    margin-top: 12px;
    font-size: 20px;
    font-weight: bold;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 25px;
    margin-top: 10px;

    background: #22c55e;
    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #16a34a;
    transform: scale(1.05);
}

.controls {
    width: 190px;
    margin: 20px auto;

    display: grid;
    grid-template-columns: repeat(3, 60px);
    gap: 5px;
}

.control {
    width: 60px;
    height: 50px;
    padding: 0;
    margin: 0;

    background: #166534;
    border: 2px solid #4ade80;

    font-size: 25px;
}

.empty {
    visibility: hidden;
}

.help {
    color: #ddd;
    margin-top: 10px;
}

#snakeImage {
    display:src="snake.jpg" ;
}
</style>
</head>

<body>

<div class="game">

    <h1>🐍 Real Snake Game</h1>

    <div class="score-box">
        <div>
            🍎 Score:
            <span id="score">0</span>
        </div>

        <div>
            🏆 High Score:
            <span id="highScore">0</span>
        </div>
    </div>

    <canvas id="gameCanvas"
            width="600"
            height="600">
    </canvas>

    <div id="message">
        Press an arrow key to start
    </div>

    <button onclick="restartGame()">
        🔄 Restart Game
    </button>

    <div class="controls">

        <button class="control empty"></button>

        <button class="control"
                onclick="changeDirection('up')">
            ⬆️
        </button>

        <button class="control empty"></button>

        <button class="control"
                onclick="changeDirection('left')">
            ⬅️
        </button>

        <button class="control"
                onclick="changeDirection('down')">
            ⬇️
        </button>

        <button class="control"
                onclick="changeDirection('right')">
            ➡️
        </button>

    </div>

    <p class="help">
        ⌨️ Use Arrow Keys or the buttons
    </p>

    <!-- Real snake image -->
    <img id="snakeImage"
        
         alt="Real Snake">

</div>


<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const highScoreText = document.getElementById("highScore");
const message = document.getElementById("message");

const snakeImage = document.getElementById("snakeImage");

const SIZE = 30;
const ROWS = canvas.width / SIZE;

let snake;
let food;

let direction;
let nextDirection;

let score = 0;
let highScore =
    localStorage.getItem("realSnakeHighScore") || 0;

let running = false;
let gameOver = false;

let gameLoop;


// --------------------------------
// START GAME
// --------------------------------

function startGame() {

    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    direction = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };

    score = 0;

    running = false;
    gameOver = false;

    scoreText.textContent = score;
    highScoreText.textContent = highScore;

    createFood();

    message.textContent =
        "Press an arrow key to start";

    draw();

}


// --------------------------------
// CREATE FOOD
// --------------------------------

function createFood() {

    do {

        food = {
            x: Math.floor(Math.random() * ROWS),
            y: Math.floor(Math.random() * ROWS)
        };

    } while (
        snake.some(
            part =>
                part.x === food.x &&
                part.y === food.y
        )
    );
}


// --------------------------------
// DRAW BACKGROUND
// --------------------------------

function drawBackground() {

    ctx.fillStyle = "#173b17";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Grass pattern

    for (let x = 0; x < canvas.width; x += 30) {

        for (let y = 0; y < canvas.height; y += 30) {

            ctx.strokeStyle =
                "rgba(255,255,255,.04)";

            ctx.strokeRect(
                x,
                y,
                SIZE,
                SIZE
            );
        }
    }
}


// --------------------------------
// DRAW FOOD
// --------------------------------

function drawFood() {

    const x =
        food.x * SIZE + SIZE / 2;

    const y =
        food.y * SIZE + SIZE / 2;

    // Apple

    ctx.fillStyle = "#ef4444";

    ctx.beginPath();

    ctx.arc(
        x,
        y + 3,
        10,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Leaf

    ctx.fillStyle = "#22c55e";

    ctx.beginPath();

    ctx.ellipse(
        x + 8,
        y - 8,
        6,
        3,
        -0.5,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Stem

    ctx.strokeStyle = "#713f12";
    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(x, y - 7);
    ctx.lineTo(x + 2, y - 14);

    ctx.stroke();
}


// --------------------------------
// DRAW REAL SNAKE
// --------------------------------

function drawSnake() {

    snake.forEach((part, index) => {

        const x = part.x * SIZE;
        const y = part.y * SIZE;

        // Use real snake image

        if (snakeImage.complete &&
            snakeImage.naturalWidth > 0) {

            ctx.save();

            ctx.beginPath();

            ctx.roundRect(
                x + 1,
                y + 1,
                SIZE - 2,
                SIZE - 2,
                8
            );

            ctx.clip();

            ctx.drawImage(
                snakeImage,
                x,
                y,
                SIZE,
                SIZE
            );

            ctx.restore();

        } else {

            // Fallback if image doesn't load

            ctx.fillStyle =
                index === 0
                ? "#22c55e"
                : "#84cc16";

            ctx.beginPath();

            ctx.roundRect(
                x + 2,
                y + 2,
                SIZE - 4,
                SIZE - 4,
                8
            );

            ctx.fill();
        }


        // Snake head

        if (index === 0) {

            drawSnakeHead(
                x + SIZE / 2,
                y + SIZE / 2
            );
        }

    });
}


// --------------------------------
// SNAKE HEAD
// --------------------------------

function drawSnakeHead(x, y) {

    ctx.fillStyle = "#111";

    let eyeOffsetX = 6;
    let eyeOffsetY = 6;

    if (direction.x < 0) {
        eyeOffsetX = -6;
    }

    if (direction.y < 0) {
        eyeOffsetY = -6;
    }

    ctx.beginPath();

    ctx.arc(
        x + eyeOffsetX,
        y + eyeOffsetY,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Eye shine

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        x + eyeOffsetX - 1,
        y + eyeOffsetY - 1,
        1,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


// --------------------------------
// DRAW GAME
// --------------------------------

function draw() {

    drawBackground();

    drawFood();

    drawSnake();
}


// --------------------------------
// UPDATE GAME
// --------------------------------

function update() {

    direction = nextDirection;

    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };


    // Wall collision

    if (
        head.x < 0 ||
        head.x >= ROWS ||
        head.y < 0 ||
        head.y >= ROWS
    ) {

        endGame();
        return;
    }


    // Self collision

    if (
        snake.some(
            part =>
                part.x === head.x &&
                part.y === head.y
        )
    ) {

        endGame();
        return;
    }


    snake.unshift(head);


    // Food eaten

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        scoreText.textContent = score;


        if (score > highScore) {

            highScore = score;

            highScoreText.textContent =
                highScore;

            localStorage.setItem(
                "realSnakeHighScore",
                highScore
            );
        }

        createFood();

    } else {

        snake.pop();

    }

    draw();
}


// --------------------------------
// CHANGE DIRECTION
// --------------------------------

function changeDirection(dir) {

    if (gameOver) return;


    if (!running) {

        running = true;

        message.textContent = "";

        clearInterval(gameLoop);

        gameLoop =
            setInterval(update, 120);
    }


    if (
        dir === "up" &&
        direction.y !== 1
    ) {

        nextDirection = {
            x: 0,
            y: -1
        };

    }

    else if (
        dir === "down" &&
        direction.y !== -1
    ) {

        nextDirection = {
            x: 0,
            y: 1
        };

    }

    else if (
        dir === "left" &&
        direction.x !== 1
    ) {

        nextDirection = {
            x: -1,
            y: 0
        };

    }

    else if (
        dir === "right" &&
        direction.x !== -1
    ) {

        nextDirection = {
            x: 1,
            y: 0
        };
    }
}


// --------------------------------
// KEYBOARD
// --------------------------------

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowUp") {

            event.preventDefault();

            changeDirection("up");
        }

        else if (event.key === "ArrowDown") {

            event.preventDefault();

            changeDirection("down");
        }

        else if (event.key === "ArrowLeft") {

            event.preventDefault();

            changeDirection("left");
        }

        else if (event.key === "ArrowRight") {

            event.preventDefault();

            changeDirection("right");
        }

        else if (
            event.key === " " &&
            gameOver
        ) {

            restartGame();
        }
    }
);


// --------------------------------
// GAME OVER
// --------------------------------

function endGame() {

    clearInterval(gameLoop);

    running = false;
    gameOver = true;

    message.textContent =
        "💀 GAME OVER!";

    draw();


    // Overlay

    ctx.fillStyle =
        "rgba(0,0,0,.7)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.textAlign = "center";

    ctx.fillStyle = "#ef4444";

    ctx.font =
        "bold 55px Arial";

    ctx.fillText(
        "GAME OVER!",
        canvas.width / 2,
        canvas.height / 2 - 20
    );


    ctx.fillStyle = "white";

    ctx.font =
        "bold 25px Arial";

    ctx.fillText(
        "Score: " + score,
        canvas.width / 2,
        canvas.height / 2 + 30
    );
}


// --------------------------------
// RESTART
// --------------------------------

function restartGame() {

    clearInterval(gameLoop);

    startGame();
}


// --------------------------------
// INITIALIZE
// --------------------------------

snakeImage.onload = function() {

    draw();

};

startGame();

</script>

</body>
</html>
